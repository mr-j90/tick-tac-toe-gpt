name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # The app must run without credentials at import time: AsyncOpenAI()
      # raises without them, so a client built at import would break this job.
      # Keeping the key out of CI is what keeps that seam honest.
      - name: Assert no API key in the environment
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY must not be set in CI"
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -m "not e2e and not live"

      - name: End-to-end tests
        run: uv run pytest -m e2e

      # A broken image should fail the PR, not the deploy.
      - name: Build container image
        run: docker build -t tick-tac-toe:ci .

      - name: Container serves requests without an API key
        run: |
          docker run -d --name ci-check -p 8000:8000 tick-tac-toe:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
          test "$(docker exec ci-check id -u)" != "0"
          docker rm -f ci-check

  live-ai:
    # Merge to main only. The PR gate above stays keyless on purpose: a job with
    # no credentials is what proves no OpenAI client is built at import time.
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Require the API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY secret is not set."
            echo "Add it with: gh secret set OPENAI_API_KEY"
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --frozen

      - name: Live AI test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run pytest -m live
